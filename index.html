:root{--bg:#F3F1EC;--card:#FFFFFF;--ink:#1E2A33;--muted:#5D6A73;--line:#DDD8CE;--accent:#1F3F5B;--accent-ink:#FFFFFF;--gold:#A6802F;--field:#FBFAF7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14181C;--card:#1D2329;--ink:#ECE9E3;--muted:#A3ADB5;--line:#333C44;--accent:#8FB4D6;--accent-ink:#10202E;--gold:#D9B86A;--field:#232A31}}
:root[data-theme="dark"]{--bg:#14181C;--card:#1D2329;--ink:#ECE9E3;--muted:#A3ADB5;--line:#333C44;--accent:#8FB4D6;--accent-ink:#10202E;--gold:#D9B86A;--field:#232A31}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Thmanyah Sans','Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
header.top{max-width:1100px;margin:0 auto;padding:20px 16px 0}
header.top h1{margin:0;font-size:24px;font-weight:900}
header.top p{margin:4px 0 0;color:var(--muted);font-size:15px}
.preview{flex:1 1 380px;min-width:0;position:sticky;top:12px}
.preview canvas{width:100%;height:auto;display:block;border-radius:14px;box-shadow:0 2px 14px rgba(0,0,0,.12);touch-action:none;cursor:grab;background:#eee}
.hint{color:var(--muted);font-size:13px;margin:8px 2px 0;text-align:center}
.panel{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{margin:0 0 12px;font-size:17px;font-weight:700}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.types button small{display:block;font-weight:400;font-size:13px;line-height:1.4;opacity:.85;margin-top:2px}
.sub{margin:-6px 0 12px;color:var(--muted);font-size:14px}
.types button{min-height:46px;text-align:right;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.types button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label{font-size:14px;font-weight:700;color:var(--muted)}
.field input[type=text],.field textarea,.field select{width:100%;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font:inherit;padding:10px 12px}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 160px}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn{min-height:48px;border-radius:12px;border:0;padding:0 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);width:100%;font-size:18px;min-height:56px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.filebtn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;border:1.5px dashed var(--accent);color:var(--ink);font-weight:700;cursor:pointer;background:var(--field)}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
input[type=range]{width:100%;accent-color:var(--accent);min-height:36px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.manual .field input{font-size:15px}
.status{color:var(--muted);font-size:14px;margin-top:10px;text-align:center;min-height:20px}
.fallback{display:none;margin-top:12px}
.fallback img{width:100%;border-radius:10px}
.fallback p{margin:0 0 8px;font-weight:700;text-align:center}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.sw.auto{width:auto;border-radius:23px;padding:0 14px;background:var(--field);color:var(--ink);font:inherit;font-weight:700;border:1.5px solid var(--line);box-shadow:none}
.sw.auto[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.custom{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);font-size:14px}
.custom input{width:46px;height:46px;border:1.5px solid var(--line);border-radius:50%;padding:0;background:none;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips button{min-height:40px;border-radius:20px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-weight:700;padding:0 14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
[hidden]{display:none !important}
</style>
</head>
<body>
<header class="top">
<h1>صانع أخبار أسرة بن عيسى</h1>
<p>اختر نوع الخبر، اكتب الأسماء، ارفع الصورة، ثم احفظ.</p>
</header>
<main class="wrap">
<section class="preview" aria-label="معاينة التصميم">
<canvas id="cv" width="1080" height="1350" aria-label="معاينة صورة الخبر"></canvas>
<p class="hint" id="dragHint" hidden>اسحب الصورة داخل القوس لضبط موضعها</p>
</section>

<section class="panel">
<div class="card">
<h2>١. القالب</h2>
<p class="sub">يحدد صياغة الخبر والخانات المطلوبة</p>
<div class="types" id="types"></div>
</div>

<div class="card">
<h2>٢. التصميم واللون والشارة</h2>
<div class="field"><label>التصميم</label><div class="seg" id="designSeg"><button type="button" data-d="split" aria-pressed="true">مقسوم</button><button type="button" data-d="light" aria-pressed="false">فاتح</button></div></div>
<div class="field"><label>اللون</label>
<div class="swatches" id="swatches"></div></div>
<div class="field" style="margin-top:6px"><label for="tagInput">شارة نوع الخبر</label>
<div class="chips" id="chips"></div>
<input type="text" id="tagInput" placeholder="أو اكتب نوع الخبر بنفسك، مثل: ترقية"></div>
</div>

<div class="card">
<h2>٣. بيانات الخبر</h2>
<div id="fields"></div>
<div class="check"><input type="checkbox" id="manualToggle"><label for="manualToggle">تعديل الصياغة يدوياً</label></div>
<div id="manual" class="manual" hidden></div>
</div>

<div class="card">
<h2>٤. الصورة</h2>
<label class="filebtn"><input type="file" id="photo" accept="image/*"><span id="photoLabel">اختر صورة من الجوال</span></label>
<div id="photoCtl" hidden>

  {t:m?'مولود ذكر اتفقا على تسميته':'مولودة أنثى اتفقا على تسميتها',k:'s',g:1},{t:v('child'),k:'h',g:1},
  {t:'بورك لوالديه في الموهوب وشكر الواهب',k:'d',g:2},{t:m?'وبلغ رشده رزقا بره':'وبلغت رشدها رزقا برها',k:'d',g:2},
  {t:'ألف ألف مبروك',k:'c',g:3}];
 if(T==='wedding')return[
  {t:'بقلوب يملؤها الفرح نزف '+rel('ابن العم'),k:'s',g:0},{t:v('groom'),k:'h',g:0},
  {t:'بمناسبة زواجه الميمون من كريمة',k:'s',g:1},{t:v('bride'),k:'n',g:1},
  {t:'بارك الله لهما وبارك عليهما وجمع بينهما في خير',k:'d',g:2},{t:'ألف ألف مبروك',k:'c',g:3}];
 if(T==='engage')return[
  {t:'بحمد الله وتوفيقه تمت خطوبة '+rel('ابن العم'),k:'s',g:0},{t:v('groom'),k:'h',g:0},
  {t:'على كريمة',k:'s',g:1},{t:v('bride'),k:'n',g:1},
  {t:'نسأل الله أن يتمم لهما على خير',k:'d',g:2},{t:'ألف ألف مبروك',k:'c',g:3}];
 if(T==='grad')return[
  {t:'تهنئ أسرة بن عيسى '+rel('ابن العم'),k:'s',g:0},{t:v('name'),k:'h',g:0},
  {t:m?'بمناسبة تخرجه وحصوله على':'بمناسبة تخرجها وحصولها على',k:'s',g:1},{t:v('degree'),k:'n',g:1},
  {t:m?'نسأل الله له التوفيق والسداد':'نسأل الله لها التوفيق والسداد',k:'d',g:2},{t:'ألف ألف مبروك',k:'c',g:3}];
 const out=[{t:v('title'),k:'h',g:0}];
 v('body').split('\n').forEach(x=>{if(x.trim())out.push({t:x.trim(),k:'d',g:1});});
 const c=(st.vals.general||{}).closing; if(c&&c.trim())out.push({t:c.trim(),k:'c',g:2});
 return out;
}
function curLines(){return (st.manual&&st.manualLines?st.manualLines:lines()).filter(l=>l.t&&l.t.trim());}

const PALETTES=[
 {name:'كحلي',p:'#1F3F5B'},{name:'عنابي',p:'#5E2440'},{name:'وردي',p:'#7A3150'},{name:'زيتوني',p:'#26584A'},
 {name:'أزرق مخضر',p:'#23495A'},{name:'بنفسجي',p:'#4A3B6B'},{name:'بني',p:'#5C4024'},{name:'أسود',p:'#22262A'}];
const TAGS=['مولود جديد','زواج','خطوبة','تخرج','تهنئة','خبر'];
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function rgb2hex(a){return'#'+a.map(x=>Math.round(Math.max(0,Math.min(255,x))).toString(16).padStart(2,'0')).join('');}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A.map((x,i)=>x+(B[i]-x)*t));}
function lum(h){const c=hex2rgb(h).map(x=>{x/=255;return x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4);});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];}
function paletteFrom(p){let q=p;let n=0;while(lum(q)>0.09&&n<20){q=mix(q,'#000000',0.08);n++;}return{p:q,bg:mix(mix(q,'#FFFFFF',0.95),'#F7F4EE',0.5),body:mix(q,'#5A5A5A',0.55)};}
function theme(){const T=TYPES[st.type];const base=st.color?paletteFrom(st.color):{p:T.p,bg:T.bg,body:T.body};return Object.assign({},base,{tag:(st.tag&&st.tag.trim())?st.tag.trim():T.tag});}
const swEl=document.getElementById('swatches'),chipsEl=document.getElementById('chips'),tagIn=document.getElementById('tagInput');
function buildSwatches(){
 swEl.textContent='';
 const a=document.createElement('button');a.type='button';a.className='sw auto';a.textContent='تلقائي';a.setAttribute('aria-pressed',!st.color);a.onclick=()=>{st.color=null;buildSwatches();draw();};swEl.appendChild(a);
 PALETTES.forEach(pl=>{const b=document.createElement('button');b.type='button';b.className='sw';b.style.background=pl.p;b.setAttribute('aria-label',pl.name);b.title=pl.name;b.setAttribute('aria-pressed',st.color===pl.p);b.onclick=()=>{st.color=pl.p;buildSwatches();draw();};swEl.appendChild(b);});
 const c=document.createElement('label');c.className='custom';const ci=document.createElement('input');ci.type='color';ci.value=st.color||TYPES[st.type].p;ci.setAttribute('aria-label','لون مخصص');ci.oninput=()=>{st.color=ci.value;[...swEl.querySelectorAll('button')].forEach(x=>x.setAttribute('aria-pressed','false'));draw();};c.appendChild(ci);c.appendChild(document.createTextNode('لون آخر'));swEl.appendChild(c);
}
function buildChips(){
 chipsEl.textContent='';const cur=theme().tag;
 TAGS.forEach(tg=>{const b=document.createElement('button');b.type='button';b.textContent=tg;b.setAttribute('aria-pressed',cur===tg);b.onclick=()=>{st.tag=tg;tagIn.value='';buildChips();draw();};chipsEl.appendChild(b);});
}
document.querySelectorAll('#designSeg button').forEach(b=>b.onclick=()=>{st.design=b.dataset.d;document.querySelectorAll('#designSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();});
tagIn.oninput=()=>{st.tag=tagIn.value.trim()?tagIn.value:null;buildChips();draw();};
// ---------- UI ----------
const typesEl=document.getElementById('types'),fieldsEl=document.getElementById('fields');
Object.keys(TYPES).forEach(k=>{const b=document.createElement('button');b.type='button';b.textContent=TYPES[k].label;const sm=document.createElement('small');sm.textContent=TYPES[k].desc;b.appendChild(sm);b.dataset.k=k;b.setAttribute('aria-pressed',k===st.type);b.onclick=()=>{st.type=k;st.tag=null;tagIn.value='';buildChips();buildSwatches();st.manual=false;st.manualLines=null;document.getElementById('manualToggle').checked=false;document.getElementById('manual').hidden=true;[...typesEl.children].forEach(c=>c.setAttribute('aria-pressed',c.dataset.k===k));buildFields();draw();};typesEl.appendChild(b);});
function buildFields(){
 fieldsEl.textContent='';
 st.vals[st.type]=st.vals[st.type]||{};
 FIELDS[st.type].forEach(f=>{
  const [key,label,def,multi]=f;
  if(key==='gender'){
   const wrap=document.createElement('div');wrap.className='field';
   const lb=document.createElement('label');lb.textContent=st.type==='birth'?'المولود':'الخريج';wrap.appendChild(lb);
   const seg=document.createElement('div');seg.className='seg';
   [['m',st.type==='birth'?'ذكر':'خريج'],['f',st.type==='birth'?'أنثى':'خريجة']].forEach(([g,t])=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.setAttribute('aria-pressed',st.gender===g);b.onclick=()=>{st.gender=g;[...seg.children].forEach((c,i)=>c.setAttribute('aria-pressed',(i===0?'m':'f')===g));draw();};seg.appendChild(b);});
   wrap.appendChild(seg);fieldsEl.appendChild(wrap);return;
  }
  const wrap=document.createElement('div');wrap.className='field';
  const id='f_'+st.type+'_'+key;
  const lb=document.createElement('label');lb.htmlFor=id;lb.textContent=label;
  const inp=document.createElement(multi?'textarea':'input');if(!multi)inp.type='text';inp.id=id;
  if(def)inp.placeholder=def;
  inp.value=st.vals[st.type][key]||'';
  inp.oninput=()=>{st.vals[st.type][key]=inp.value;draw();};
  wrap.appendChild(lb);wrap.appendChild(inp);fieldsEl.appendChild(wrap);
 });
}
const manualEl=document.getElementById('manual');
document.getElementById('manualToggle').onchange=e=>{
 st.manual=e.target.checked;manualEl.hidden=!st.manual;fieldsEl.style.opacity=st.manual?.45:1;fieldsEl.style.pointerEvents=st.manual?'none':'';
 if(st.manual){st.manualLines=lines().map(l=>Object.assign({},l));manualEl.textContent='';
  st.manualLines.forEach((l,i)=>{const w=document.createElement('div');w.className='field';const id='m_'+i;const lb=document.createElement('label');lb.htmlFor=id;lb.textContent='السطر '+(i+1);const inp=document.createElement('input');inp.type='text';inp.id=id;inp.value=l.t;inp.oninput=()=>{l.t=inp.value;draw();};w.appendChild(lb);w.appendChild(inp);manualEl.appendChild(w);});
 }
 draw();
};

// photo
const photoIn=document.getElementById('photo'),zoomIn=document.getElementById('zoom');
photoIn.onchange=()=>{const f=photoIn.files&&photoIn.files[0];if(!f)return;const url=URL.createObjectURL(f);const im=new Image();im.onload=()=>{st.img=im;st.zoom=1;st.ox=0;st.oy=0;zoomIn.value=1;document.getElementById('photoCtl').hidden=false;document.getElementById('dragHint').hidden=false;document.getElementById('photoLabel').textContent='تغيير الصورة';draw();};im.src=url;};
zoomIn.oninput=()=>{st.zoom=parseFloat(zoomIn.value);draw();};
document.getElementById('removePhoto').onclick=()=>{st.img=null;photoIn.value='';document.getElementById('photoCtl').hidden=true;document.getElementById('dragHint').hidden=true;document.getElementById('photoLabel').textContent='اختر صورة من الجوال';draw();};

// ---------- drawing ----------
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const logo=new Image();logo.src=LOGO_SRC;
let frame={x:0,y:0,w:0,h:0};
const tintCache={};
function tinted(color){if(tintCache[color])return tintCache[color];const c=document.createElement('canvas');c.width=logo.naturalWidth;c.height=logo.naturalHeight;const x=c.getContext('2d');x.drawImage(logo,0,0);x.globalCompositeOperation='source-in';x.fillStyle=color;x.fillRect(0,0,c.width,c.height);tintCache[color]=c;return c;}
function arch(x,y,w,h,r,br){ctx.beginPath();ctx.moveTo(x,y+h-br);ctx.lineTo(x,y+r);ctx.arc(x+r,y+r,r,Math.PI,0);ctx.lineTo(x+w,y+h-br);ctx.quadraticCurveTo(x+w,y+h,x+w-br,y+h);ctx.lineTo(x+br,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-br);ctx.closePath();}
function fontOf(k,s,heroSize){const F="'Thmanyah Sans','Segoe UI',Tahoma,sans-serif";
 if(k==='s')return{f:'500 '+(26*s)+'px '+F,size:26*s,lh:1.4};
 if(k==='n')return{f:'700 '+(40*s)+'px '+F,size:40*s,lh:1.4};
 if(k==='h')return{f:'900 '+(heroSize*s)+'px '+F,size:heroSize*s,lh:1.15};
 if(k==='d')return{f:'400 '+(25*s)+'px '+F,size:25*s,lh:1.55};
 return{f:'700 '+(32*s)+'px '+F,size:32*s,lh:1.4};}
function wrap(text,maxW){const words=text.split(/\s+/);const out=[];let cur='';words.forEach(w=>{const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){out.push(cur);cur=w;}else cur=t;});if(cur)out.push(cur);return out;}
function layout(ls,s,maxW){
 const items=[];let y=0,lastG=null;
 ls.forEach(l=>{
  const hero=l.t.length<=12?80:58;
  const fo=fontOf(l.k,s,hero);ctx.font=fo.f;
  if(lastG!==null&&l.g!==lastG)y+=18*s;lastG=l.g;
  wrap(l.t,maxW).forEach(row=>{const lh=fo.size*fo.lh;items.push({row,k:l.k,f:fo.f,y:y+lh/2});y+=lh;});
  if(l.k==='h'){items.push({rule:true,y:y+6*s});y+=14*s;}
 });
 return{items,h:y};
}
const F="'Thmanyah Sans','Segoe UI',Tahoma,sans-serif";
const SIZES=[[480,540],[440,490],[400,445],[380,420],[340,378],[310,345]];
function fit(ls,top){
 const bottomLimit=1222,maxW=888;
 for(const [fw,fh] of SIZES){const L=layout(ls,1,maxW);if(top+fh+36+L.h<=bottomLimit)return{fw,fh,lay:L};}
 const [fw,fh]=SIZES[SIZES.length-1];const avail=bottomLimit-(top+fh+36);let s=1,L=layout(ls,1,maxW);while(L.h>avail&&s>0.55){s-=0.03;L=layout(ls,s,maxW);}return{fw,fh,lay:L};
}
function drawFrame(T,fx,fy,fw,fh){
 const fr=fw/2;frame={x:fx+10,y:fy+10,w:fw-20,h:fh-20};
 arch(fx,fy,fw,fh,fr,24);ctx.fillStyle=T.bg;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=GOLD;ctx.stroke();
 const ix=fx+10,iy=fy+10,iw=fw-20,ih=fh-20;
 ctx.save();arch(ix,iy,iw,ih,iw/2,16);ctx.clip();
 if(st.img){const im=st.img;const base=Math.max(iw/im.naturalWidth,ih/im.naturalHeight)*st.zoom;const dw=im.naturalWidth*base,dh=im.naturalHeight*base;
  const mx=(dw-iw)/2,my=(dh-ih)/2;st.ox=Math.max(-mx,Math.min(mx,st.ox));st.oy=Math.max(-my,Math.min(my,st.oy));
  ctx.drawImage(im,ix+(iw-dw)/2+st.ox,iy+(ih-dh)/2+st.oy,dw,dh);}
 else{ctx.fillStyle='#FFFFFF';ctx.fillRect(ix,iy,iw,ih);if(logo.complete&&logo.naturalWidth){ctx.globalAlpha=0.14;const lw=iw*0.55,lh=lw*logo.naturalHeight/logo.naturalWidth;ctx.drawImage(tinted(T.p),ix+(iw-lw)/2,iy+(ih-lh)/2,lw,lh);ctx.globalAlpha=1;}}
 ctx.restore();
}
function drawText(T,lay,ty){
 ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';
 lay.items.forEach(it=>{
  if(it.rule){ctx.fillStyle=GOLD;ctx.fillRect(W/2-28,ty+it.y,56,1.5);return;}
  ctx.font=it.f;ctx.fillStyle=it.k==='s'||it.k==='d'?T.body:(it.k==='c'?GOLD:T.p);
  ctx.fillText(it.row,W/2,ty+it.y);
 });
}
function drawFooter(T){
 const fyy=H-54-14,yr=String(new Date().getFullYear());ctx.direction='ltr';ctx.textBaseline='middle';ctx.fillStyle=T.p;
 ctx.font='500 24px '+F;ctx.textAlign='left';ctx.fillText(yr,72,fyy);const y4=ctx.measureText(yr).width;
 ctx.font='700 24px '+F;ctx.textAlign='center';ctx.fillText('bineissanews',W/2,fyy);const nw=ctx.measureText('bineissanews').width;
 ctx.fillStyle=GOLD;ctx.fillRect(72+y4+22,fyy,(W/2-nw/2-22)-(72+y4+22),1);
 const iconsW=26+14+24;ctx.fillRect(W/2+nw/2+22,fyy,(W-72-iconsW-22)-(W/2+nw/2+22),1);
 drawIcons(W-72-iconsW,fyy,T.p);ctx.direction='rtl';
}
function pill(text,cx,y,stroke,fill){ctx.font='700 24px '+F;const tw=ctx.measureText(text).width+52;const x=cx-tw/2;ctx.save();ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,tw,52,26):ctx.rect(x,y,tw,52);ctx.stroke();ctx.fillStyle=fill;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';ctx.fillText(text,cx,y+27);ctx.restore();return tw;}
// logo arch centre in a 380px-wide logo: (185.5, 179.5)
function watermark(img,lw,cy){const s=lw/380,lh=lw*logo.naturalHeight/logo.naturalWidth;ctx.drawImage(img,W/2-185.5*s,cy-179.5*s,lw,lh);}
function draw(){
 const T=theme();ctx.setTransform(1,0,0,1,0,0);ctx.direction='rtl';
 ctx.fillStyle=T.bg;ctx.fillRect(0,0,W,H);
 const ls=curLines();const hasLogo=logo.complete&&logo.naturalWidth;
 if(st.design==='light'){
  
  ctx.save();ctx.strokeStyle=GOLD;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect?ctx.roundRect(32,32,W-64,H-64,20):ctx.rect(32,32,W-64,H-64);ctx.stroke();ctx.restore();
  const lw=104,lh=hasLogo?lw*logo.naturalHeight/logo.naturalWidth:112;
  if(hasLogo)ctx.drawImage(tinted(T.p),(W-lw)/2,64,lw,lh);
  const tagY=64+lh+16;pill(T.tag,W/2,tagY,GOLD,T.p);
  const top=tagY+52+24;const R=fit(ls,top);
  if(hasLogo){ctx.save();ctx.globalAlpha=0.045;watermark(tinted(T.p),820,top+R.fw/2);ctx.restore();}
  drawFrame(T,(W-R.fw)/2,top,R.fw,R.fh);drawText(T,R.lay,top+R.fh+36);drawFooter(T);return;
 }
 const top=200;const R=fit(ls,top);const fw=R.fw,fh=R.fh,fx=(W-fw)/2,fy=top;
 const bandH=fy+fh/2+20;
 ctx.fillStyle=T.p;ctx.fillRect(0,0,W,bandH);
 if(hasLogo){ctx.save();ctx.beginPath();ctx.rect(0,0,W,bandH);ctx.clip();ctx.globalAlpha=0.07;watermark(logo,760,fy+fw/2);ctx.restore();
  const sw=92,sh=sw*logo.naturalHeight/logo.naturalWidth;ctx.drawImage(logo,W-72-sw,56,sw,sh);}
 ctx.font='700 24px '+F;const tw=ctx.measureText(T.tag).width+52;pill(T.tag,72+tw/2,80,GOLD_L,GOLD_L);
 drawFrame(T,fx,fy,fw,fh);drawText(T,R.lay,fy+fh+36);drawFooter(T);
}
function drawIcons(x,cy,color){
 ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=1.7*26/24;ctx.lineJoin='round';ctx.lineCap='round';
 ctx.translate(x,cy-13);ctx.scale(26/24,26/24);
 ctx.stroke(new Path2D('M12 3c-3 0-5 2.2-5 5.2v2.3l-1.6.4c-.5.2-.4.8.1 1l1.3.5c-.6 1.6-1.7 3-3.3 3.6.3.7 1.3.9 2.2 1 .2.6.3 1.1.7 1.1.6 0 1.4-.4 2.6 0 1 .4 1.8 1.4 3 1.4s2-1 3-1.4c1.2-.4 2 0 2.6 0 .4 0 .5-.5.7-1.1.9-.1 1.9-.3 2.2-1-1.6-.6-2.7-2-3.3-3.6l1.3-.5c.5-.2.6-.8.1-1L17 10.5V8.2C17 5.2 15 3 12 3z'));
 ctx.restore();
 ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=1.7;ctx.translate(x+40,cy-12);
 const p=new Path2D();if(p.roundRect){p.roundRect(3,3,18,18,5);}else{p.rect(3,3,18,18);}ctx.stroke(p);
 ctx.beginPath();ctx.arc(12,12,4.2,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(17.3,6.7,1,0,Math.PI*2);ctx.fill();ctx.restore();
}

// drag to pan
let drag=null;
function toCanvas(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',e=>{if(!st.img)return;const p=toCanvas(e);if(p.x<frame.x||p.x>frame.x+frame.w||p.y<frame.y||p.y>frame.y+frame.h)return;drag={x:p.x,y:p.y,ox:st.ox,oy:st.oy};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=toCanvas(e);st.ox=drag.ox+(p.x-drag.x);st.oy=drag.oy+(p.y-drag.y);draw();});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{drag=null;}));

// save
const statusEl=document.getElementById('status'),fb=document.getElementById('fallback');
function showFallback(){draw();fb.style.display='block';document.getElementById('fallbackImg').src=cv.toDataURL('image/png');}
document.getElementById('save').onclick=async()=>{
 draw();statusEl.textContent='';fb.style.display='none';
 const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
 const d=new Date();const name='bineissa-'+st.type+'-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.png';
 const file=new File([blob],name,{type:'image/png'});
 const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform));
 if(mobile&&navigator.canShare&&navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file]});statusEl.textContent='تم';return;}
  catch(e){if(e&&e.name==='AbortError'){statusEl.textContent='تم إلغاء الحفظ';return;}}
 }
 try{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);statusEl.textContent='تم تنزيل الصورة';
  if(mobile)showFallback();}
 catch(e){showFallback();}
};

buildSwatches();buildChips();buildFields();
const fontsReady=document.fonts?Promise.all(['400','500','700','900'].map(w=>document.fonts.load(w+" 30px 'Thmanyah Sans'","أب"))):Promise.resolve();
logo.onload=()=>draw();
fontsReady.then(draw,draw);
draw();
})();
</script>
